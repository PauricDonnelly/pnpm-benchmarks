<text x="74" y="145" font-size="21" fill="#536168">notarial-marriage-fee-api · install time · lower is faster</text>
<text x="74" y="184" font-size="16" fill="#647178">Measured 2026-11-06 · Node v24.19.0 · pnpr 0.1.0-alpha.18 · 50 ms RTT · 200 Mbps</text>
<text x="74" y="247" font-size="14" font-weight="700" letter-spacing="1.2" fill="#647178">ELAPSED TIME</text>
