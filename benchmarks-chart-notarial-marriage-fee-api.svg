<text x="745" y="337" text-anchor="middle" font-size="15" font-weight="600"><tspan x="745" dy="0">With</tspan><tspan x="745" dy="20">lockfile</tspan></text>
<text x="895" y="337" text-anchor="middle" font-size="15" font-weight="600"><tspan x="895" dy="0">Warm cache</tspan><tspan x="895" dy="20">+ modules</tspan></text>
<text x="1045" y="337" text-anchor="middle" font-size="15" font-weight="600"><tspan x="1045" dy="0">Warm</tspan><tspan x="1045" dy="20">cache</tspan></text>
<text x="1195" y="337" text-anchor="middle" font-size="15" font-weight="600"><tspan x="1195" dy="0">Warm cache</tspan><tspan x="1195" dy="20">+ lockfile</tspan></text>
<text x="1345" y="337" text-anchor="middle" font-size="15" font-weight="600"><tspan x="1345" dy="0">Warm modules</tspan><tspan x="1345" dy="20">+ lockfile</tspan></text>
<text x="1495" y="337" text-anchor="middle" font-size="15" font-weight="600"><tspan x="1495" dy="0">Repeat</tspan><tspan x="1495" dy="20">install</tspan></text>
<text x="1645" y="337" text-anchor="middle" font-size="15" font-weight="600"><tspan x="1645" dy="0">Updated</tspan><tspan x="1645" dy="20">dependencies</tspan></text>
