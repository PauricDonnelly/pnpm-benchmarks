<text x="74" y="595" font-size="24" font-weight="700">Test scenarios</text>
<text x="74" y="619" font-family="Menlo, Monaco, monospace" font-size="12" fill="#536168">npm install --no-fund --no-audit --ignore-scripts --cache=cache --legacy-peer-deps --registry=&lt;benchmark-registry&gt;</text>
<text x="74" y="638" font-family="Menlo, Monaco, monospace" font-size="12" fill="#536168">pnpm install --ignore-scripts --registry=&lt;benchmark-registry&gt;</text>
<text x="74" y="657" font-size="12" fill="#536168">The registry placeholder resolves to the benchmark registry; updated-dependencies adds --no-frozen-lockfile to pnpm.</text>
<text x="74" y="688" font-size="14" font-weight="700">First install</text>
<text x="74" y="710" font-size="14" fill="#536168">Install from scratch with no lockfile, node_modules, or cache.</text>
<text x="649" y="688" font-size="14" font-weight="700">Warm modules</text>
<text x="649" y="710" font-size="14" fill="#536168">Keep node_modules; remove the lockfile and package cache.</text>
<text x="1224" y="688" font-size="14" font-weight="700">With lockfile</text>
<text x="1224" y="710" font-size="14" fill="#536168">Keep the lockfile; remove node_modules and package cache.</text>
<text x="74" y="768" font-size="14" font-weight="700">Warm cache + modules</text>
<text x="74" y="790" font-size="14" fill="#536168">Keep node_modules and package cache; remove the lockfile.</text>
<text x="649" y="768" font-size="14" font-weight="700">Warm cache</text>
<text x="649" y="790" font-size="14" fill="#536168">Keep package cache; remove node_modules and lockfile.</text>
<text x="1224" y="768" font-size="14" font-weight="700">Warm cache + lockfile</text>
<text x="1224" y="790" font-size="14" fill="#536168">Keep lockfile and package cache; remove node_modules.</text>
<text x="74" y="848" font-size="14" font-weight="700">Warm modules + lockfile</text>
<text x="74" y="870" font-size="14" fill="#536168">Keep node_modules and lockfile; remove package cache.</text>
<text x="649" y="848" font-size="14" font-weight="700">Repeat install</text>
<text x="649" y="870" font-size="14" fill="#536168">Run again after first install, keeping its modules, lockfile, and cache.</text>
<text x="1224" y="848" font-size="14" font-weight="700">Updated dependencies</text>
<text x="1224" y="870" font-size="14" fill="#536168">Add extra dependencies; retain modules and rewarm the package cache.</text>
<rect x="74" y="916" width="1650" height="58" rx="8" fill="#e5e9e3"/>
<rect x="74" y="916" width="4" height="58" rx="2" fill="#187e75"/>
<text x="96" y="940" font-size="12" font-weight="700" letter-spacing="1" fill="#536168">CACHE NOTE</text>
<text x="96" y="960" font-size="14" fill="#202c33">Warm-cache cases test reusing downloaded packages, as when CI restores a package-manager cache. The temporary cache lives at TMP/&lt;manager-scenario&gt;/&lt;fixture&gt;/cache and is cleared between scenarios.</text>
</g></svg>
