<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
<title id="title">JavaScript package manager benchmarks</title>
<desc id="description">Benchmark timings for package manager installation scenarios. Each x-axis scenario is explained below the heatmap, followed by a note on where the temporary package cache is kept. Cell colors use a logarithmic scale and each cell shows its exact time.</desc>
<defs><linearGradient id="time-scale"><stop offset="0%" stop-color="rgb(24,126,117)"/><stop offset="35%" stop-color="rgb(137,177,147)"/><stop offset="68%" stop-color="rgb(229,199,116)"/><stop offset="100%" stop-color="rgb(199,99,79)"/></linearGradient></defs>
